name: Run Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Compile C program
      run: |
        gcc -pthread -o bgmi bgmi.c
        chmod +x bgmi
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pyTelegramBotAPI pymongo certifi pytz psutil aiohttp
    
    - name: Run Bot
      run: python Danger.py
      timeout-minutes: 350
